<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Form</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, button { padding: 5px; margin: 5px; }
    table { border-collapse: collapse; width: 60%; margin-top: 10px; }
    th, td { border: 1px solid black; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    .buttons { margin: 15px 0; }
  </style>
</head>
<body>

  <h2>Student Form</h2>

  <form id="studentForm">
    <input type="text" id="name" placeholder="Enter student name" required>
    <input type="number" id="marks" placeholder="Enter marks" required>
    <button type="submit">Add Student</button>
  </form>

  <div class="buttons">
    <button onclick="showAll()">Show All Students</button>
    <button onclick="showPassed()">Show Passed Students</button>
    <button onclick="showAverage()">Calculate Average Marks</button>
    <button onclick="showTopper()">Find Topper</button>
  </div>

  <h3>Student List</h3>
  <table id="studentTable">
    <tr>
      <th>Name</th>
      <th>Marks</th>
    </tr>
  </table>

  <h3 id="result"></h3>

  <script>
    const form = document.getElementById('studentForm');
    const table = document.getElementById('studentTable');
    const result = document.getElementById('result');

    let students = []; // store all students

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const marks = parseInt(document.getElementById('marks').value);

      if(name && !isNaN(marks)) {
        students.push({name, marks});
        form.reset();
        showAll(); // refresh list after adding
      }
    });

    function renderTable(data) {
      // Clear table except header
      table.innerHTML = `
        <tr>
          <th>Name</th>
          <th>Marks</th>
        </tr>
      `;

      data.forEach(s => {
        const row = table.insertRow();
        row.insertCell(0).textContent = s.name;
        row.insertCell(1).textContent = s.marks;
      });
    }

    function showAll() {
      renderTable(students);
      result.textContent = "";
    }

    function showPassed() {
      const passed = students.filter(s => s.marks >= 40);
      renderTable(passed);
      result.textContent = "Showing students who passed (marks ≥ 40)";
    }

    function showAverage() {
      if(students.length === 0) {
        result.textContent = "No students added yet!";
        return;
      }
      const sum = students.reduce((acc, s) => acc + s.marks, 0);
      const avg = (sum / students.length);
      result.textContent = "Average Marks: " + avg;
    }

    function showTopper() {
      if(students.length === 0) {
        result.textContent = "No students added yet!";
        return;
      }
      let topper = students.reduce((max, s) => s.marks > max.marks ? s : max);
      result.textContent = "Topper: " + topper.name + " (Marks: " + topper.marks + ")";
    }
  </script>

</body>
</html>
